<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07060E"/>
      <stop offset="100%" style="stop-color:#0D0B1A"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="25%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#7F1D1D;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="75%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#3B0764;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#1E1040;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2040;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#4B3A7A;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#4B3A7A;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2A2040;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-left)"/>
  <rect width="1200" height="630" fill="url(#glow-right)"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#8B5CF6"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- TOP: Brand -->
  <!-- ══════════════════════════════════════ -->
  <circle cx="600" cy="54" r="6" fill="#7C3AED" filter="url(#subtle-glow)"/>
  <circle cx="600" cy="54" r="4" fill="#A855F7"/>
  <text x="600" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="800" fill="#EEE8FF" text-anchor="middle" letter-spacing="-1.5">InfraCanvas</text>
  <text x="600" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#6B6380" text-anchor="middle" letter-spacing="0.5">Live visibility and control for your Linux server</text>

  <!-- ══════════════════════════════════════ -->
  <!-- CENTER DIVIDER -->
  <!-- ══════════════════════════════════════ -->
  <line x1="600" y1="155" x2="600" y2="490" stroke="url(#divider)" stroke-width="1"/>

  <!-- Arrow in center -->
  <g transform="translate(600, 320)">
    <!-- Arrow shaft -->
    <rect x="-28" y="-1" width="56" height="2" fill="url(#arrow-grad)" rx="1"/>
    <!-- Arrowhead -->
    <polygon points="28,-6 40,0 28,6" fill="#A855F7" opacity="0.9"/>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- LEFT: The problems (BEFORE) -->
  <!-- ══════════════════════════════════════ -->

  <!-- Section label -->
  <text x="280" y="175" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="2" opacity="0.8">BEFORE</text>

  <!-- Pain point 1 -->
  <g transform="translate(100, 218)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#130608" stroke="#3F1010" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FCA5A5">SSH every time just to check.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">Is nginx running? Did postgres restart? What's using port 8080?</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">You have to SSH in and grep around to find out.</text>
  </g>

  <!-- Pain point 2 -->
  <g transform="translate(100, 306)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#130608" stroke="#3F1010" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FCA5A5">Crashes found hours later.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">A container died at 2am. Traffic failed silently. You discovered</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">it at 10am when a user complained.</text>
  </g>

  <!-- Pain point 3 -->
  <g transform="translate(100, 394)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#130608" stroke="#3F1010" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FCA5A5">No picture of what's connected.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">Containers, pods, networks, volumes — scattered across</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A4545">docker ps, kubectl get, df -h, ss -tlnp.</text>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- RIGHT: The solution (AFTER) -->
  <!-- ══════════════════════════════════════ -->

  <!-- Section label -->
  <text x="920" y="175" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="2" opacity="0.8">AFTER</text>

  <!-- Solution 1 -->
  <g transform="translate(740, 218)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#04130B" stroke="#0D3B22" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#6EE7B7">Open a browser tab instead.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">Every container, pod, volume, network — visible on a live</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">canvas. Updates in real time. No refresh needed.</text>
  </g>

  <!-- Solution 2 -->
  <g transform="translate(740, 306)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#04130B" stroke="#0D3B22" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#6EE7B7">See it the moment it happens.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">Status changes push instantly over WebSocket. A crash</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">turns red on your screen the second it occurs.</text>
  </g>

  <!-- Solution 3 -->
  <g transform="translate(740, 394)">
    <rect x="0" y="0" width="360" height="72" rx="10" fill="#04130B" stroke="#0D3B22" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#6EE7B7">Start, stop, restart — from the UI.</text>
    <text x="20" y="48" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">Click any container or pod to act on it directly.</text>
    <text x="20" y="63" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2E7A55">Full control, no terminal required.</text>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- BOTTOM: Install command -->
  <!-- ══════════════════════════════════════ -->
  <rect x="0" y="505" width="1200" height="125" fill="#050410" opacity="0.97"/>
  <line x1="0" y1="505" x2="1200" y2="505" stroke="#1A1730" stroke-width="1"/>

  <!-- Label -->
  <text x="600" y="533" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4B4560" text-anchor="middle" letter-spacing="2">ONE COMMAND. THAT'S IT.</text>

  <!-- Command box -->
  <rect x="200" y="545" width="800" height="50" rx="10" fill="#0C0B1C" stroke="#2A2640" stroke-width="1.5"/>
  <!-- green dot -->
  <circle cx="228" cy="570" r="5" fill="#10B981"/>
  <!-- command text -->
  <text x="244" y="566" font-family="ui-monospace,monospace" font-size="13" fill="#6B6380">$</text>
  <text x="260" y="566" font-family="ui-monospace,monospace" font-size="13" fill="#9B91C0">curl -fsSL </text>
  <text x="347" y="566" font-family="ui-monospace,monospace" font-size="13" fill="#C084FC">https://github.com/bytestrix/InfraCanvas/releases/latest/download/install.sh</text>
  <text x="260" y="584" font-family="ui-monospace,monospace" font-size="13" fill="#9B91C0">  | bash</text>
  <!-- cursor blink -->
  <rect x="316" y="575" width="8" height="13" rx="1" fill="#4B4560" opacity="0.7"/>

  <!-- Subtext -->
  <text x="600" y="614" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#3A3558" text-anchor="middle">No Docker. No signup. No firewall change. Opens a public HTTPS URL in 30 seconds.</text>

</svg>
