<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07060E"/>
      <stop offset="100%" style="stop-color:#0E0B1C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4C1D95;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" style="stop-color:#0E4F5C;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#1E1040;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#07060E;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="headline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EEE8FF"/>
      <stop offset="60%" style="stop-color:#C4BFDF"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="cmd-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4C1D95;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="0.8" fill="#7C3AED" opacity="0.12"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ── TOP: Logo + Brand ── -->
  <image href="data:image/png;base64," x="548" y="28" width="52" height="52"/>
  <text x="608" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="800" fill="url(#headline-grad)" letter-spacing="-1">InfraCanvas</text>

  <!-- ── HEADLINE ── -->
  <text x="600" y="125" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="800" fill="#EEE8FF" text-anchor="middle" letter-spacing="-0.5">Your server is a black box.</text>
  <text x="600" y="168" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#6B6380" text-anchor="middle">You SSH in to check. You grep logs to debug. You find out about crashes</text>
  <text x="600" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#6B6380" text-anchor="middle">from your users. <tspan font-weight="700" fill="#A78BFA">InfraCanvas fixes that.</tspan></text>

  <!-- Divider line -->
  <line x1="200" y1="222" x2="1000" y2="222" stroke="#1E1B35" stroke-width="1"/>

  <!-- ── FEATURE GRID (2×3) ── -->

  <!-- Row 1 -->

  <!-- Feature 1: Live map -->
  <rect x="80" y="238" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="80" y="238" width="4" height="82" rx="2" fill="#7C3AED"/>
  <text x="100" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Live visual map</text>
  <text x="100" y="289" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Every container, pod, volume and network</text>
  <text x="100" y="307" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">on a single canvas. Updates in real time.</text>

  <!-- Feature 2: Instant crash alerts -->
  <rect x="440" y="238" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="440" y="238" width="4" height="82" rx="2" fill="#EF4444"/>
  <text x="460" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Crashes go red instantly</text>
  <text x="460" y="289" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Status changes push over WebSocket the</text>
  <text x="460" y="307" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">second they happen. Not when you check.</text>

  <!-- Feature 3: Control -->
  <rect x="800" y="238" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="800" y="238" width="4" height="82" rx="2" fill="#10B981"/>
  <text x="820" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Full control from the browser</text>
  <text x="820" y="289" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Start, stop, restart containers and pods.</text>
  <text x="820" y="307" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">No SSH. No terminal. Click and done.</text>

  <!-- Row 2 -->

  <!-- Feature 4: Logs -->
  <rect x="80" y="336" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="80" y="336" width="4" height="82" rx="2" fill="#0891B2"/>
  <text x="100" y="366" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Live log streaming</text>
  <text x="100" y="387" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Tail any container's logs directly in the</text>
  <text x="100" y="405" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">dashboard. No more journalctl juggling.</text>

  <!-- Feature 5: Terminal -->
  <rect x="440" y="336" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="440" y="336" width="4" height="82" rx="2" fill="#D97706"/>
  <text x="460" y="366" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Built-in terminal</text>
  <text x="460" y="387" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Full interactive shell inside any container</text>
  <text x="460" y="405" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">or on the host. Right in the browser tab.</text>

  <!-- Feature 6: Zero setup -->
  <rect x="800" y="336" width="320" height="82" rx="10" fill="#0D0B1C" stroke="#1E1B35" stroke-width="1.5"/>
  <rect x="800" y="336" width="4" height="82" rx="2" fill="#A855F7"/>
  <text x="820" y="366" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#C4BFDF">Zero setup. Public URL in 30s.</text>
  <text x="820" y="387" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">One binary. Free Cloudflare tunnel. No</text>
  <text x="820" y="405" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#4B4560">Docker, no signup, no firewall change.</text>

  <!-- Works with chips -->
  <text x="600" y="450" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#3A3558" text-anchor="middle" font-weight="600" letter-spacing="1">WORKS WITH</text>
  <rect x="390" y="458" width="80" height="22" rx="6" fill="#0F0E1C" stroke="#2A2640" stroke-width="1"/>
  <text x="430" y="473" font-family="ui-monospace,monospace" font-size="10" fill="#7DB8CC" text-anchor="middle">Docker</text>
  <rect x="480" y="458" width="80" height="22" rx="6" fill="#0F0E1C" stroke="#2A2640" stroke-width="1"/>
  <text x="520" y="473" font-family="ui-monospace,monospace" font-size="10" fill="#7DB8CC" text-anchor="middle">Kubernetes</text>
  <rect x="570" y="458" width="76" height="22" rx="6" fill="#0F0E1C" stroke="#2A2640" stroke-width="1"/>
  <text x="608" y="473" font-family="ui-monospace,monospace" font-size="10" fill="#7DB8CC" text-anchor="middle">Compose</text>
  <rect x="656" y="458" width="76" height="22" rx="6" fill="#0F0E1C" stroke="#2A2640" stroke-width="1"/>
  <text x="694" y="473" font-family="ui-monospace,monospace" font-size="10" fill="#7DB8CC" text-anchor="middle">Systemd</text>
  <rect x="742" y="458" width="68" height="22" rx="6" fill="#0F0E1C" stroke="#2A2640" stroke-width="1"/>
  <text x="776" y="473" font-family="ui-monospace,monospace" font-size="10" fill="#7DB8CC" text-anchor="middle">Linux</text>

  <!-- ── INSTALL COMMAND ── -->
  <rect x="0" y="500" width="1200" height="130" fill="#050410"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#1A1730" stroke-width="1"/>

  <text x="600" y="526" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#3A3558" text-anchor="middle" letter-spacing="2">INSTALL IN ONE COMMAND</text>

  <!-- Command box -->
  <rect x="140" y="537" width="920" height="52" rx="10" fill="#0C0B1C" stroke="#2A2248" stroke-width="1.5"/>
  <!-- green dot -->
  <circle cx="168" cy="563" r="5" fill="#10B981"/>
  <!-- prompt -->
  <text x="184" y="559" font-family="ui-monospace,monospace" font-size="13" fill="#4B4560">$</text>
  <text x="200" y="559" font-family="ui-monospace,monospace" font-size="13" fill="#8B82B0">curl -fsSL </text>
  <text x="286" y="559" font-family="ui-monospace,monospace" font-size="13" fill="#C084FC">https://github.com/bytestrix/InfraCanvas/releases/latest/download/install.sh</text>
  <text x="200" y="578" font-family="ui-monospace,monospace" font-size="13" fill="#8B82B0">  | bash</text>
  <rect x="254" y="569" width="8" height="13" rx="1" fill="#4B4560" opacity="0.6"/>

  <!-- Sub-caption -->
  <text x="600" y="610" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#3A3558" text-anchor="middle">Prints a public HTTPS URL. Paste it in any browser. That's your dashboard.</text>

</svg>
