<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background: clean white -->
  <rect width="1200" height="630" fill="#F9F9F9"/>

  <!-- Subtle horizontal lines -->
  <g opacity="0.04" stroke="#000000" stroke-width="0.5">
    <line x1="0" y1="42" x2="1200" y2="42"/>
    <line x1="0" y1="84" x2="1200" y2="84"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="294" x2="1200" y2="294"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="462" x2="1200" y2="462"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="546" x2="1200" y2="546"/>
    <line x1="0" y1="588" x2="1200" y2="588"/>
  </g>

  <!-- Subtle vertical lines -->
  <g opacity="0.03" stroke="#000000" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Corner bracket marks -->
  <g stroke="#000000" stroke-width="1.5" opacity="0.18" fill="none">
    <polyline points="20,40 20,20 40,20"/>
    <polyline points="1160,40 1160,20 1140,20"/>
    <polyline points="20,590 20,610 40,610"/>
    <polyline points="1160,590 1160,610 1140,610"/>
  </g>

  <!-- ── LOGO (original, no filter — dark logo on light bg) ── -->
  <image href="data:image/png;base64," x="555" y="24" width="90" height="90"/>

  <!-- ── HEADLINE ── -->
  <text x="600" y="155" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="-1.5">Stop SSHing just to check what's running.</text>

  <text x="600" y="191" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#999999" text-anchor="middle">You shouldn't need a terminal to know if nginx is up, which port is in use,</text>
  <text x="600" y="213" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#555555" text-anchor="middle" font-weight="500">or why your container crashed. <tspan font-weight="700" fill="#111111">InfraCanvas shows you — live, in a browser tab.</tspan></text>

  <!-- Divider -->
  <line x1="80" y1="222" x2="1120" y2="222" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ── FEATURE GRID ── -->

  <!-- Row 1 -->
  <rect x="80" y="234" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="80" y1="234" x2="80" y2="322" stroke="#111111" stroke-width="2" opacity="0.7"/>
  <text x="100" y="262" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Live visual map</text>
  <text x="100" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Every container, pod, volume and network on</text>
  <text x="100" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">a single canvas. Updates in real time.</text>

  <rect x="435" y="234" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="435" y1="234" x2="435" y2="322" stroke="#111111" stroke-width="2" opacity="0.7"/>
  <text x="455" y="262" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Crashes go red instantly</text>
  <text x="455" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Status changes push the second they happen.</text>
  <text x="455" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Not when you check.</text>

  <rect x="790" y="234" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="790" y1="234" x2="790" y2="322" stroke="#111111" stroke-width="2" opacity="0.7"/>
  <text x="810" y="262" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Full control from browser</text>
  <text x="810" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Start, stop, restart containers and pods.</text>
  <text x="810" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">No SSH. No terminal. Click and done.</text>

  <!-- Row 2 -->
  <rect x="80" y="336" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="80" y1="336" x2="80" y2="424" stroke="#111111" stroke-width="2" opacity="0.3"/>
  <text x="100" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Live log streaming</text>
  <text x="100" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Tail any container's output directly in the</text>
  <text x="100" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">dashboard. No more journalctl juggling.</text>

  <rect x="435" y="336" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="435" y1="336" x2="435" y2="424" stroke="#111111" stroke-width="2" opacity="0.3"/>
  <text x="455" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Built-in terminal</text>
  <text x="455" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Full interactive shell in any container or</text>
  <text x="455" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">on the host. Right in the browser tab.</text>

  <rect x="790" y="336" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="790" y1="336" x2="790" y2="424" stroke="#111111" stroke-width="2" opacity="0.3"/>
  <text x="810" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#111111">Zero setup. Public URL in 30s.</text>
  <text x="810" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">One binary. Free Cloudflare tunnel. No</text>
  <text x="810" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#888888">Docker, no signup, no firewall change.</text>

  <!-- Works with -->
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#E5E5E5" stroke-width="1"/>
  <text x="600" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#BBBBBB" text-anchor="middle" letter-spacing="2" font-weight="600">WORKS WITH</text>
  <g font-family="ui-monospace,monospace" font-size="11" fill="#AAAAAA">
    <rect x="380" y="470" width="72" height="20" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <text x="416" y="484" text-anchor="middle">Docker</text>
    <rect x="462" y="470" width="88" height="20" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <text x="506" y="484" text-anchor="middle">Kubernetes</text>
    <rect x="560" y="470" width="80" height="20" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <text x="600" y="484" text-anchor="middle">Compose</text>
    <rect x="650" y="470" width="72" height="20" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <text x="686" y="484" text-anchor="middle">Systemd</text>
    <rect x="732" y="470" width="56" height="20" rx="4" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <text x="760" y="484" text-anchor="middle">Linux</text>
  </g>

  <!-- ── INSTALL BAR ── -->
  <rect x="0" y="505" width="1200" height="125" fill="#F0F0F0"/>
  <line x1="0" y1="505" x2="1200" y2="505" stroke="#E0E0E0" stroke-width="1"/>

  <rect x="130" y="524" width="940" height="52" rx="8" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  <circle cx="160" cy="550" r="5" fill="#111111" opacity="0.7"/>
  <text x="178" y="546" font-family="ui-monospace,monospace" font-size="13" fill="#BBBBBB">$</text>
  <text x="194" y="546" font-family="ui-monospace,monospace" font-size="13" fill="#999999">curl -fsSL </text>
  <text x="278" y="546" font-family="ui-monospace,monospace" font-size="13" fill="#333333">https://github.com/bytestrix/InfraCanvas/releases/latest/download/install.sh</text>
  <text x="194" y="565" font-family="ui-monospace,monospace" font-size="13" fill="#999999">  | bash</text>
  <rect x="248" y="556" width="7" height="12" rx="1" fill="#BBBBBB" opacity="0.7"/>

  <text x="600" y="607" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#BBBBBB" text-anchor="middle">Prints a public HTTPS URL. Paste it in any browser. That's your dashboard.</text>

</svg>
